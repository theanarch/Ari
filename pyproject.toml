[project]
name = "ari-mcp"
version = "0.1.0"
description = "MCP servers giving an AI agent read-only access to public documents and a guarded SQL Server memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "mssql-python>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
ari-mcp = "ari_mcp.server:main"
ari-memory = "ari_mcp.memory_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ari_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
